<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FES Ratingen · Terminübersicht 2026/27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#22303C;
    --ink-soft:#41505D;
    --paper:#F5F1E6;
    --paper-raised:#FFFFFF;
    --line:#DDD6C4;
    --today:#3F6B4E;
    --today-bg:#E7EEE5;

    --c-ferien:#C0862E;      --c-ferien-bg:#F5E6CC;
    --c-feiertag:#B0576C;    --c-feiertag-bg:#F3DFE4;
    --c-pruefung:#A0472F;    --c-pruefung-bg:#F0DCD4;
    --c-konferenz:#4C5A82;   --c-konferenz-bg:#DEE1EC;
    --c-eltern:#7A4F7D;      --c-eltern-bg:#E9DDEA;
    --c-bo:#2E7873;          --c-bo-bg:#D9E9E7;
    --c-fahrt:#6B7A3B;       --c-fahrt-bg:#E4E8D3;
    --c-schulleben:#3E6B8A;  --c-schulleben-bg:#DBE6EC;
    --c-verwaltung:#7A6F5E;  --c-verwaltung-bg:#E7E3DA;
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .display{font-family:'Fraunces', Georgia, serif;}

  header.hero{
    background:var(--ink);
    color:var(--paper);
    padding:32px 20px 28px;
  }
  .hero-inner{max-width:640px;margin:0 auto;}
  .brand-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:20px;
  }
  .brand-row img{
    width:56px;
    height:56px;
    flex:0 0 auto;
    border-radius:12px;
    background:#fff;
    padding:5px;
  }
  .eyebrow{
    font-size:13px;
    letter-spacing:.02em;
    color:#AEBAC2;
    margin:0 0 6px;
  }
  h1{
    font-family:'Fraunces', Georgia, serif;
    font-weight:600;
    font-optical-sizing:auto;
    font-size:clamp(22px, 5.2vw, 30px);
    line-height:1.05;
    margin:0;
    letter-spacing:-0.01em;
  }
  .today-line{
    font-size:15px;
    color:#CBD3D2;
    margin:0 0 18px;
  }
  .brand-row{margin-bottom:18px;}

  .status-card{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:14px;
    padding:16px 18px;
  }
  .status-card.is-active{
    background:rgba(63,107,78,0.35);
    border-color:rgba(151,201,164,0.5);
  }
  .status-label{
    font-size:12px;
    text-transform:none;
    color:#9FCBAF;
    margin:0 0 6px;
    font-weight:600;
  }
  .status-title{
    font-size:17px;
    font-weight:500;
    line-height:1.35;
    margin:0;
  }
  .status-title + .status-title{margin-top:8px;}
  .status-sub{
    font-size:13.5px;
    color:#C7CEC9;
    margin-top:4px;
  }

  .next-section{margin-top:16px;}
  .next-heading{
    font-size:12px;
    font-weight:600;
    color:#9FCBAF;
    margin:0 0 8px;
  }
  .next-strip{
    display:flex;
    gap:10px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scroll-snap-type:x proximity;
    padding-bottom:4px;
    margin:0 -2px;
    scrollbar-width:none;
  }
  .next-strip::-webkit-scrollbar{display:none;}
  .next-card{
    scroll-snap-align:start;
    flex:0 0 78%;
    max-width:260px;
    text-align:left;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.16);
    border-radius:12px;
    padding:12px 13px;
    color:var(--paper);
    font-family:inherit;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .next-card:active{background:rgba(255,255,255,0.14);}
  .next-card .nc-date{
    font-size:12px;
    font-weight:600;
    color:#9FCBAF;
    margin:0 0 5px;
  }
  .next-card .nc-title{
    font-size:14px;
    line-height:1.35;
    margin:0;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  @media (min-width:480px){
    .next-card{flex-basis:47%;}
  }

  main{max-width:640px;margin:0 auto;padding:22px 16px 80px;}

  .toolbar{
    position:sticky;
    top:0;
    background:var(--paper);
    padding:14px 0 12px;
    z-index:5;
    border-bottom:1px solid var(--line);
    margin-bottom:6px;
  }
  .search{
    width:100%;
    padding:11px 14px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--paper-raised);
    font-size:15px;
    font-family:inherit;
    color:var(--ink);
    margin-bottom:10px;
  }
  .search:focus{outline:2px solid var(--today); outline-offset:1px;}

  .chips{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding-bottom:2px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    padding:7px 13px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--paper-raised);
    font-size:13.5px;
    font-weight:500;
    color:var(--ink-soft);
    cursor:pointer;
    white-space:nowrap;
    -webkit-tap-highlight-color:transparent;
  }
  .chip[aria-pressed="true"]{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
  }

  .month-heading{
    font-family:'Fraunces', Georgia, serif;
    font-size:15px;
    font-weight:600;
    color:var(--ink-soft);
    letter-spacing:.01em;
    margin:28px 0 10px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .month-heading:first-of-type{margin-top:18px;}

  .event{
    display:flex;
    gap:14px;
    padding:13px 4px;
    border-bottom:1px solid var(--line);
    align-items:flex-start;
  }
  .event.is-past{opacity:0.42;}
  .event.is-today{
    background:var(--today-bg);
    border-radius:12px;
    padding:13px 12px;
    margin:2px -12px;
    border-bottom:1px solid transparent;
  }
  .event.flash{
    animation:flashHighlight 1.6s ease;
    border-radius:12px;
    margin:2px -12px;
    padding:13px 12px;
  }
  @keyframes flashHighlight{
    0%{background:var(--today-bg);}
    70%{background:var(--today-bg);}
    100%{background:transparent;}
  }

  .date-badge{
    flex:0 0 52px;
    text-align:center;
    padding-top:1px;
  }
  .date-badge .day{
    font-family:'Fraunces', Georgia, serif;
    font-size:23px;
    font-weight:600;
    line-height:1;
    color:var(--ink);
  }
  .is-today .date-badge .day{color:var(--today);}
  .date-badge .wd{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:3px;
    display:block;
  }
  .date-badge .range{
    font-size:10.5px;
    color:var(--ink-soft);
    margin-top:2px;
    display:block;
  }

  .event-body{flex:1; min-width:0;}
  .event-title{
    font-size:15.5px;
    line-height:1.4;
    margin:0;
    font-weight:500;
  }
  .event-extra{
    font-size:13px;
    color:var(--ink-soft);
    margin:5px 0 0;
    line-height:1.45;
    padding-left:10px;
    border-left:2px solid var(--c-bo);
  }
  .tag-row{margin-top:7px; display:flex; gap:6px; flex-wrap:wrap;}
  .tag{
    font-size:11px;
    font-weight:600;
    padding:3px 8px;
    border-radius:6px;
    display:inline-block;
  }
  .now-flag{
    font-size:11px;
    font-weight:700;
    color:var(--today);
    margin-left:2px;
  }

  .empty-state{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-soft);
    font-size:14.5px;
  }

  footer{
    max-width:640px;
    margin:0 auto;
    padding:0 20px 40px;
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.6;
  }
  footer .legend{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:10px 0 16px;
  }

  @media (min-width:640px){
    .event-title{font-size:16px;}
  }
</style>
</head>

// ---- helpers ----
const WD = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

function parseDate(s){
  const [y,m,d] = s.split("-").map(Number);
  return new Date(y, m-1, d);
}
function fmtDay(dt){ return dt.getDate(); }
function fmtRange(ev){
  const s = parseDate(ev.d);
  if(!ev.e) return null;
  const en = parseDate(ev.e);
  const pad = n => String(n).padStart(2,"0");
  return `${pad(s.getDate())}.${pad(s.getMonth()+1)}.–${pad(en.getDate())}.${pad(en.getMonth()+1)}.`;
}
function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function dayDiff(a,b){ // a - b in whole days
  const A = new Date(a.getFullYear(),a.getMonth(),a.getDate());
  const B = new Date(b.getFullYear(),b.getMonth(),b.getDate());
  return Math.round((A-B)/86400000);
}

const today = new Date();
const todayMidnight = new Date(today.getFullYear(), today.getMonth(), today.getDate());

// precompute
EVENTS.forEach((ev,i)=>{
  ev.id = i;
  ev.start = parseDate(ev.d);
  ev.end = ev.e ? parseDate(ev.e) : ev.start;
  ev.isCurrent = todayMidnight >= ev.start && todayMidnight <= ev.end;
  ev.isPast = ev.end < todayMidnight && !ev.isCurrent;
});

// ---- status card ----
const todayLine = document.getElementById("todayLine");
todayLine.textContent = `${WD[today.getDay()]}, ${today.getDate()}. ${MONTHS[today.getMonth()]} ${today.getFullYear()}`;

function fmtGerman(dt){
  const pad = n => String(n).padStart(2,"0");
  return `${pad(dt.getDate())}.${pad(dt.getMonth()+1)}.`;
}

const statusCard = document.getElementById("statusCard");
const statusLabel = document.getElementById("statusLabel");
const statusBody = document.getElementById("statusBody");
const nextSection = document.getElementById("nextSection");
const nextStrip = document.getElementById("nextStrip");

const currentEvents = EVENTS.filter(ev=>ev.isCurrent);
const futureEvents = EVENTS.filter(ev=>ev.start > todayMidnight).sort((a,b)=>a.start-b.start);

if(currentEvents.length){
  statusCard.classList.add("is-active");
  statusLabel.textContent = "Heute";
  statusBody.innerHTML = currentEvents.map(ev=>{
    const cat = CATS[ev.c];
    return `<p class="status-title">${ev.t}${ev.e ? ` <span class="status-sub" style="display:inline">(${cat.label}, bis ${fmtGerman(ev.end)})</span>`:""}</p>`;
  }).join("");
} else if(futureEvents.length){
  const next = futureEvents[0];
  const diff = dayDiff(next.start, todayMidnight);
  statusLabel.textContent = "Heute";
  statusBody.innerHTML = `<p class="status-title">Kein Termin heute.</p>
    <p class="status-sub">Nächster Termin in ${diff} ${diff===1?"Tag":"Tagen"} (${fmtGerman(next.start)}): ${next.t}</p>`;
} else {
  statusLabel.textContent = "Heute";
  statusBody.innerHTML = `<p class="status-title">Für diesen Zeitraum liegen keine weiteren Termine vor.</p>`;
}

function scrollToEvent(id){
  activeCats = new Set(Object.keys(CATS));
  searchTerm = "";
  document.getElementById("searchInput").value = "";
  renderChips();
  renderAgenda();
  requestAnimationFrame(()=>{
    const el = document.getElementById(`ev-${id}`);
    if(el){
      el.scrollIntoView({block:"center", behavior:"smooth"});
      el.classList.add("flash");
      setTimeout(()=>el.classList.remove("flash"), 1600);
    }
  });
}

const upcomingForStrip = futureEvents.slice(0, 10);
if(upcomingForStrip.length){
  nextSection.style.display = "";
  nextStrip.innerHTML = upcomingForStrip.map(ev=>{
    const diff = dayDiff(ev.start, todayMidnight);
    const whenLabel = diff===1 ? "morgen" : `in ${diff} Tagen`;
    return `<button class="next-card" data-goto="${ev.id}">
      <p class="nc-date">${fmtGerman(ev.start)} · ${whenLabel}</p>
      <p class="nc-title">${ev.t}</p>
    </button>`;
  }).join("");
  nextStrip.querySelectorAll("button[data-goto]").forEach(btn=>{
    btn.addEventListener("click", ()=>scrollToEvent(Number(btn.dataset.goto)));
  });
} else {
  nextSection.style.display = "none";
}



// ---- chips ----
const chipsEl = document.getElementById("chips");
let activeCats = new Set(Object.keys(CATS));
let searchTerm = "";

function renderChips(){
  const allBtn = `<button class="chip" id="chipAll" aria-pressed="${activeCats.size===Object.keys(CATS).length}">Alle</button>`;
  const catBtns = Object.entries(CATS).map(([key,val])=>{
    return `<button class="chip" data-cat="${key}" aria-pressed="${activeCats.has(key)}">${val.label}</button>`;
  }).join("");
  chipsEl.innerHTML = allBtn + catBtns;

  document.getElementById("chipAll").addEventListener("click", ()=>{
    activeCats = new Set(Object.keys(CATS));
    renderChips(); renderAgenda();
  });
  chipsEl.querySelectorAll("button[data-cat]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const k = btn.dataset.cat;
      if(activeCats.has(k) && activeCats.size===Object.keys(CATS).length){
        // narrowing from "all" state: select only this one
        activeCats = new Set([k]);
      } else if(activeCats.has(k)){
        activeCats.delete(k);
        if(activeCats.size===0) activeCats = new Set(Object.keys(CATS));
      } else {
        activeCats.add(k);
      }
      renderChips(); renderAgenda();
    });
  });
}

document.getElementById("searchInput").addEventListener("input", (e)=>{
  searchTerm = e.target.value.trim().toLowerCase();
  renderAgenda();
});

// ---- agenda ----
const agendaEl = document.getElementById("agenda");

function renderAgenda(){
  let list = EVENTS.filter(ev=>activeCats.has(ev.c));
  if(searchTerm){
    list = list.filter(ev=>
      ev.t.toLowerCase().includes(searchTerm) ||
      (ev.x||"").toLowerCase().includes(searchTerm) ||
      CATS[ev.c].label.toLowerCase().includes(searchTerm)
    );
  }
  list = list.slice().sort((a,b)=>a.start-b.start);

  if(list.length===0){
    agendaEl.innerHTML = `<div class="empty-state">Keine Termine gefunden.</div>`;
    return;
  }

  let html = "";
  let lastMonthKey = "";
  let todayAnchorSet = false;

  list.forEach(ev=>{
    const monthKey = `${ev.start.getFullYear()}-${ev.start.getMonth()}`;
    if(monthKey !== lastMonthKey){
      html += `<div class="month-heading">${MONTHS[ev.start.getMonth()]} ${ev.start.getFullYear()}</div>`;
      lastMonthKey = monthKey;
    }
    const cat = CATS[ev.c];
    const cls = ["event"];
    if(ev.isPast) cls.push("is-past");
    if(ev.isCurrent) cls.push("is-today");

    let anchorAttr = "";
    if(!todayAnchorSet && (ev.isCurrent || ev.start >= todayMidnight)){
      anchorAttr = ` data-today-anchor="true"`;
      todayAnchorSet = true;
    }

    const rangeLabel = fmtRange(ev);

    html += `<div class="${cls.join(' ')}" id="ev-${ev.id}"${anchorAttr}>
      <div class="date-badge">
        <span class="day">${fmtDay(ev.start)}</span>
        <span class="wd">${WD[ev.start.getDay()]}</span>
        ${rangeLabel ? `<span class="range">${rangeLabel}</span>` : ""}
      </div>
      <div class="event-body">
        <p class="event-title">${ev.t}${ev.isCurrent ? ' <span class="now-flag">· JETZT</span>' : ''}</p>
        ${ev.x ? `<p class="event-extra">${ev.x}</p>` : ""}
        <div class="tag-row">
          <span class="tag" style="color:${cat.c}; background:${cat.bg};">${cat.label}</span>
        </div>
      </div>
    </div>`;
  });

  agendaEl.innerHTML = html;
}

// ---- legend ----
const legendEl = document.getElementById("legend");
legendEl.innerHTML = Object.values(CATS).map(cat=>
  `<span class="tag" style="color:${cat.c}; background:${cat.bg};">${cat.label}</span>`
).join("");

// ---- init ----
renderChips();
renderAgenda();

// scroll to today/next event on load
window.addEventListener("load", ()=>{
  const anchor = document.querySelector("[data-today-anchor]");
  if(anchor){
    anchor.scrollIntoView({block:"center"});
  }
});
</script>
</body>
</html>
